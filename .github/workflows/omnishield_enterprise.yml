name: OmniShield AI Enterprise CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build OmniShield Workspace
        run: cargo build --workspace --release

      - name: Test OmniShield Workspace
        run: cargo test --workspace

      - name: Verify CLI
        run: cargo run -p omnishield --release -- --version

      - name: Create Vulnerable CI Fixture
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/omnishield-ci-fixture

          cat > /tmp/omnishield-ci-fixture/vulnerable.py <<'PY'
          user_input = input("value: ")
          eval(user_input)
          os.system(user_input)
          PY

      - name: Run Security Scan
        shell: bash
        run: |
          set +e

          cargo run -p omnishield --release -- \
            scan /tmp/omnishield-ci-fixture \
            --sarif omnishield.sarif \
            --fail-on high

          status=$?
          set -e

          if [ "$status" -ne 1 ]; then
            echo "Expected vulnerable fixture to exit with code 1, got $status"
            exit 1
          fi

          echo "Expected vulnerability detection confirmed."

      - name: Validate Expected Findings
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json
          from collections import Counter
          from pathlib import Path

          report = json.loads(Path("omnishield.sarif").read_text())
          results = report["runs"][0]["results"]

          counts = Counter(result["ruleId"] for result in results)

          expected = {
              "PY-EVAL-001": 1,
              "PY-CMD-001": 1,
              "TAINT-001": 2,
          }

          assert len(results) == 4, (
              f"Expected 4 findings, got {len(results)}"
          )

          assert dict(counts) == expected, (
              f"Unexpected finding distribution: {dict(counts)}"
          )

          print("Expected finding distribution confirmed:", dict(counts))
          PYEOF

      - name: Validate Clean Scan
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/omnishield-clean

          printf 'fn main() { println!("hello"); }\n' \
            > /tmp/omnishield-clean/main.rs

          cargo run -p omnishield --release -- \
            scan /tmp/omnishield-clean \
            --sarif omnishield-clean.sarif \
            --fail-on high

      - name: Validate SARIF
        run: |
          python3 -m json.tool omnishield.sarif > /dev/null
          python3 -m json.tool omnishield-clean.sarif > /dev/null

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: omnishield.sarif

      - name: Upload OmniShield Reports
        uses: actions/upload-artifact@v4
        with:
          name: omnishield-reports
          path: |
            omnishield.sarif
            omnishield-clean.sarif
