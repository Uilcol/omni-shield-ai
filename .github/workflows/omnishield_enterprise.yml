name: OmniShield AI Enterprise CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build-test-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build OmniShield Workspace
        run: cargo build --workspace --release

      - name: Test OmniShield Workspace
        run: cargo test --workspace

      - name: Verify CLI
        run: cargo run -p omnishield --release -- --version

      - name: Run Security Scan
        shell: bash
        run: |
          set +e
          cargo run -p omnishield --release -- scan sample_project \
            --sarif omnishield.sarif \
            --fail-on high
          status=$?
          set -e

          if [ "$status" -ne 1 ]; then
            echo "Expected vulnerable fixture to exit with code 1, got $status"
            exit 1
          fi

          echo "Expected vulnerability detection confirmed."

      - name: Validate Clean Scan
        shell: bash
        run: |
          mkdir -p /tmp/omnishield-clean
          printf 'fn main() { println!("hello"); }\n' > /tmp/omnishield-clean/main.rs

          cargo run -p omnishield --release -- scan /tmp/omnishield-clean \
            --sarif omnishield-clean.sarif \
            --fail-on high

      - name: Validate SARIF
        run: |
          python3 -m json.tool omnishield.sarif > /dev/null
          python3 -m json.tool omnishield-clean.sarif > /dev/null

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: omnishield.sarif

      - name: Upload OmniShield Reports
        uses: actions/upload-artifact@v4
        with:
          name: omnishield-reports
          path: |
            omnishield.sarif
            omnishield-clean.sarif
