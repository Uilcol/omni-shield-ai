name: OmniUil AI Enterprise CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Rust
      # -----------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # -----------------------------
      # Build Rust Workspace
      # -----------------------------
      - name: Build OmniUil
        run: cargo build --workspace --release

      # -----------------------------
      # Run OmniUil Scan + SARIF
      # -----------------------------
      - name: Run OmniUil Security Scan
        run: |
          cargo run -p cli --release -- scan . \
            --sarif omniuil.sarif \
            --fail-on high

      # -----------------------------
      # Upload SARIF to GitHub Security
      # -----------------------------
      - name: Upload SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: omniuil.sarif

      # -----------------------------
      # Setup Python
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r engine/requirements.txt

      # -----------------------------
      # Run Enterprise Pipeline
      # -----------------------------
      - name: Run Enterprise Full Stack Pipeline
        run: python engine/engine_pipeline_fullstack_enterprise.py

      # -----------------------------
      # Archive Reports
      # -----------------------------
      - name: Archive Audit Reports
        uses: actions/upload-artifact@v4
        with:
          name: omniuil-reports
          path: |
            reports/
            omniuil.sarif