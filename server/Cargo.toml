[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

jsonwebtoken = "9"
rsa = "0.9"

redis = { version = "0.24.1", features = ["tokio-comp"] }

dotenvy = "0.15"
